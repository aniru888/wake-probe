name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: xcodebuild -version && sw_vers
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Unit tests (Simulator)
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test -scheme WakeProbe -destination "id=$SIM_ID" -derivedDataPath build/test | tail -n 50
      - name: Build unsigned Release for device
        run: |
          set -euo pipefail
          xcodebuild -scheme WakeProbe -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA (fail loudly if the widget is missing)
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          test -d "$APP/PlugIns/ProbeWidgets.appex"
          test -f "$APP/probe_ramp.wav"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/ && zip -qr WakeProbe.ipa Payload
          ls -la WakeProbe.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WakeProbe-ipa
          path: WakeProbe.ipa
